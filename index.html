<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <header> 

        <h1> Online Survey </h1>

    </header>
    
    <section>
        <form action="" method="get">
             <fieldset>
                

                <legend>Personal Information</legend>
            
                <label for="userName">Name:</label>
                <input type="text" name="userName" placeholder="Enter your name" required>
                <br>
                
                <label for="userAge">Age:</label>
                <input type="number" name="userAge" placeholder="Enter your age" min="12" max="100" required>
                <br>
                
                <label for="birthDate">Date of Birth:</label>
                <input type="date" name="birthDate" required>
                <br>
                
                <label for="userEmail">Email:</label>
                <input type="email" name="userEmail" placeholder="Enter your email" required>
                <br>
                
                <label for="userPhone">Phone Number:</label>
                <input type="tel" name="userPhone" placeholder="Area Code + XXXXXXXXXX" pattern="[0-9]{11}" required>
                <br>
                
                <label for="userImage">Upload Image:</label>
                <input type="file" accept="image/*" name="userImage">
                <br>
            </fieldset> 
                
           
             <fieldset>
                <legend>Perfil</legend>
               
                <p>Gender:</p>

                <input type="radio" name="userGender" value="female">
                <label for="userGender">Female</label>
                
                <input type="radio" name="userGender" value="male">
                <label for="userGender">Male</label>

                <input type="radio" name="userGender" value="other">
                <label for="userGender">Other</label>
            <br>
                
                <label for="maritalStatus">Marital Status:</label>
                <select name="maritalStatus">
                    <option value="notInformed" disabled selected>Select your marital status</option>
                    <option value="single">Single</option>
                    <option value="married">Married</option>
                    <option value="divorced">Divorced</option>
                    <option value="widowed">Widowed</option>
                </select>
               
                <label for="userCountry">Country:</label>
                <select name="userCountry" id="userCountry" required>
                    <option value="NotInformed" disabled selected>Select your country</option>
                    <option value="brazil">Brazil</option>
                    <option value="unitedStates">United States</option>
                    <option value="canada">Canada</option>
                    <option value="unitedKingdom">United Kingdom</option>
                    <option value="france">France</option>
                    <option value="germany">Germany</option>
                    <option value="italy">Italy</option>
                    <option value="spain">Spain</option>
                    <option value="portugal">Portugal</option>
                    <option value="japan">Japan</option>
                    <option value="SouthKorea">South Korea</option>
                    <option value="China">China</option>
                    <option value="australia">Australia</option>
                    <option value="newZealand">New Zealand</option>
                    <option value="mexico">Mexico</option>
                    <option value="argentina">Argentina</option>
                    <option value="chile">Chile</option>
                    <option value="Netherlands">Netherlands</option>
                    <option value="switzerland">Switzerland</option>
                    <option value="Sweden">Sweden</option>
                </select>
            <br>
                <label for="userCity">City:</label>
                <input type="text" name="userCity" id="userCity" placeholder="Enter your city">
            </fieldset> 
              
            <fieldset>
                <legend>Habits</legend>
                <p> Social Media</p>
                <input type="checkbox" name="social" value="Instagram">
                <label for="userHabits">Instagram</label>
                <br>
                <input type="checkbox" name="social" value="Facebook">
                <label for="userHabits">Facebook</label>
                <br>
                <input type="checkbox" name="social" value="Twitter">
                <label for="userHabits">X (Twitter)</label>
                <br>
                <input type="checkbox" name="social" value="TikTok">
                <label for="userHabits">TikTok</label>
                <br>
           
           
            </fieldset>

                
                
                
                
                <button type="submit" value="Submit">Submit</button>
        </form>

    </section>

      


</body>
</html>
